; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_speed = 921600
upload_protocol = teensy-gui
extra_scripts = copy_hex.py
build_unflags =
    -O2                    ; Remove default -O2 (optimize for speed)
build_flags =
    -D SCHEDULER_TIMING_STATS
    -D ARDUINOJSON_ENABLE_PROGMEM=0 ; ArduinoJson's PROGMEM tables clash with our .progmem pages on GCC 15 (section type conflict)
    ; B10.49 (2026-10-19, Betreiber): HR/PH-Log-Ausgabe schaltbar.
    ;   0 = AUS (Produktivbetrieb, Standard)      1 = nur HR-Zeile
    ;   2 = nur PH-Zeile                          3 = beide (wie im Feld bis 10-18)
    ; Der Sim (env:sim) setzt das Flag NICHT und loggt immer, damit der Replay laeuft.
    -D AIO_HR_LOG=3
    -Wl,-Map,.pio/build/teensy41/firmware.map
    ; Optimization flags
    -Os                    ; Optimize for size instead of speed
    -fno-exceptions        ; Disable C++ exceptions (~24 KB savings)
    -fno-rtti              ; Disable runtime type information
    -ffunction-sections    ; Place each function in its own section
    -fdata-sections        ; Place each data item in its own section
    -Wl,--gc-sections      ; Remove unused sections at link time

; ---------------------------------------------------------------------------
; Simulator (Host-Build, KEIN Teensy): kompiliert den ECHTEN HeadingBridge.cpp
; und PositionHistory.cpp gegen die Stubs in tools/sim/stubs.
; Konzept: knowledge/simulator_concept_2026-10-11.md
; Bauen:  pio run -e sim          Starten: sim.exe (Parameter siehe sim.ps1)
; ---------------------------------------------------------------------------
[env:sim]
platform = native
build_flags =
    -std=gnu++17
    -O1
    -Itools/sim/stubs          ; Stubs ZUERST (shadowt lib/aio_system/EventLogger.h)
    -Ilib/aio_navigation
    -Ilib/aio_config
    -Ilib/aio_system
    -Ilib/aio_autosteer          ; MotorDriverInterface.h (reine Schnittstelle) fuer den VWAS
    -DSIM_BUILD=1
    -lws2_32                                    ; Winsock fuer S2b (PAOGI -> AgOpenGPS)
    -lwinmm                                     ; timeBeginPeriod(1): echter 100-Hz-Takt
build_src_filter =
    -<*>                                        ; echten Teensy-main ausschliessen
    +<../tools/sim/main.cpp>
    +<../tools/sim/stubs/>
    +<../tools/sim/src/HeadingBridge.cpp>
    +<../tools/sim/src/PositionHistory.cpp>
    ; 10-11: der VWAS ist die zweite echte Quelle im Sim - damit replayt eine echte Fahrt
    ; die GANZE Kette (VWAS -> wheel angle -> Bridge) und der Trim wird pruefbar.
    ; Der Motor/Encoder kommt aus stubs/motor_stub (spielt enc_cnt bzw. den Log-Winkel ein).
    +<../tools/sim/src/WheelAngleFusion.cpp>
    ; 10-13: der RING (positionHistory.push) steckt im PositionHistoryService - ohne ihn
    ; ist der Ring im Sim LEER und jede ringbasierte Logik (updatePathFromRing, die
    ; B-Kette updatePathChord) kann NIE feuern (gemessen: pc_ok blieb in allen
    ; Zustand-B-Frames 0, on/off-Kontrolllauf zahlengleich). Nach demselben Muster
    ; wie die anderen echten Quellen: Datei kopieren, hier eintragen.
    +<../tools/sim/src/PositionHistoryService.cpp>